name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, "Mobile Safari", "Mobile Chrome"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright Version
      id: playwright-version
      run: echo "version=$(npx playwright --version | cut -d ' ' -f 2)" >> $GITHUB_OUTPUT

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers
      run: |
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list || true
        npx playwright install ${{ matrix.project == 'Mobile Safari' && 'webkit' || 'chromium' }}
      
    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.MONGO_URI }}"
        echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
        echo "::add-mask::${{ secrets.SCC_ADMIN_LOGIN_URL }}"
        echo "::add-mask::${{ secrets.SCC_ADMIN_TOKEN }}"

    - name: Run Playwright tests
      id: playwright-run
      timeout-minutes: 10
      continue-on-error: true
      run: npx playwright test --project="${{ matrix.project }}"
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        BASE_URL: ${{ secrets.BASE_URL }}
        SCC_ADMIN_LOGIN_URL: ${{ secrets.SCC_ADMIN_LOGIN_URL }}
        SCC_ADMIN_TOKEN: ${{ secrets.SCC_ADMIN_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SLOW_NETWORK: 'false'

    - name: Run AI Agentic Self-Healer (On Test Failure)
      if: steps.playwright-run.outcome == 'failure'
      timeout-minutes: 5
      run: npm run heal:prod
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        BASE_URL: ${{ secrets.BASE_URL }}
        SCC_ADMIN_LOGIN_URL: ${{ secrets.SCC_ADMIN_LOGIN_URL }}
        SCC_ADMIN_TOKEN: ${{ secrets.SCC_ADMIN_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Auto-Commit & Push AI Healed Locators Back to Repo
      if: steps.playwright-run.outcome == 'failure'
      run: |
        git config user.name "AI-Healer[bot]"
        git config user.email "ai-healer@users.noreply.github.com"
        git add tasks/ utils/ "SCC member area monitoring/"
        git diff --staged --quiet || git commit -m "chore(ai-healer): auto-repair locators via Gemini [skip ci]"
        git push origin HEAD:${{ github.ref_name }} || echo "No changes or push failed"

    - name: Upload Test Results Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.project }}
        path: test-results/
        retention-days: 7

    - name: Upload Playwright Blob Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.project }}
        path: blob-report/
        retention-days: 1

    - name: Manage GitHub Issues on Failure / Recovery
      if: always()
      run: node scripts/manage-issues.js
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PROJECT_NAME: ${{ matrix.project }}
        TEST_OUTCOME: ${{ steps.playwright-run.outcome }}

    - name: Set Step Status
      if: steps.playwright-run.outcome == 'failure'
      run: exit 1

  merge-reports:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download all Blob Reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge Playwright HTML Reports
      run: npx playwright merge-reports --reporter html ./all-blob-reports

    - name: Upload Unified HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: playwright-report/
        retention-days: 14
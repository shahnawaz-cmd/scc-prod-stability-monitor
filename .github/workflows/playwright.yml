name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, "Mobile Safari", "Mobile Chrome"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Get Playwright Version
      id: playwright-version
      run: echo "version=$(npx playwright --version | cut -d ' ' -f 2)" >> $GITHUB_OUTPUT

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Clean Broken APT Sources & Install Playwright Browsers with OS Deps
      run: |
        sudo rm -f /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list || true
        npx playwright install --with-deps ${{ matrix.project == 'Mobile Safari' && 'webkit' || 'chromium' }}
      
    - name: Mask Sensitive Secrets in CI Logs
      run: |
        echo "::add-mask::${{ secrets.MONGO_URI }}"
        echo "::add-mask::${{ secrets.GEMINI_API_KEY }}"
        echo "::add-mask::${{ secrets.SLACK_WEBHOOK_URL }}"
        echo "::add-mask::${{ secrets.SCC_ADMIN_LOGIN_URL }}"
        echo "::add-mask::${{ secrets.SCC_ADMIN_TOKEN }}"

    - name: Run Playwright tests
      id: playwright-run
      timeout-minutes: 10
      continue-on-error: true
      run: npx playwright test --project="${{ matrix.project }}"
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        BASE_URL: ${{ secrets.BASE_URL }}
        SCC_ADMIN_LOGIN_URL: ${{ secrets.SCC_ADMIN_LOGIN_URL }}
        SCC_ADMIN_TOKEN: ${{ secrets.SCC_ADMIN_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SLOW_NETWORK: 'false'

    - name: Run AI Agentic Self-Healer (On Test Failure)
      if: steps.playwright-run.outcome == 'failure'
      timeout-minutes: 5
      run: npm run heal:prod
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        BASE_URL: ${{ secrets.BASE_URL }}
        SCC_ADMIN_LOGIN_URL: ${{ secrets.SCC_ADMIN_LOGIN_URL }}
        SCC_ADMIN_TOKEN: ${{ secrets.SCC_ADMIN_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Auto-Commit & Push AI Healed Locators Back to Repo
      if: steps.playwright-run.outcome == 'failure'
      run: |
        git config user.name "AI-Healer[bot]"
        git config user.email "ai-healer@users.noreply.github.com"
        git add tasks/ utils/ "SCC member area monitoring/"
        git diff --staged --quiet || git commit -m "chore(ai-healer): auto-repair locators via Gemini [skip ci]"
        git push origin HEAD:${{ github.ref_name }} || echo "No changes or push failed"

    - name: Upload Failure Artifacts (Videos, Traces, Screenshots)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failure-artifacts-${{ matrix.project == 'chromium' && 'chromium' || (matrix.project == 'Mobile Safari' && 'mobile-safari' || 'mobile-chrome') }}
        path: test-results/
        retention-days: 3

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results-${{ matrix.project == 'chromium' && 'chromium' || (matrix.project == 'Mobile Safari' && 'mobile-safari' || 'mobile-chrome') }}
        path: allure-results/
        retention-days: 1

    - name: Upload Blob Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blob-report-${{ matrix.project == 'chromium' && 'chromium' || (matrix.project == 'Mobile Safari' && 'mobile-safari' || 'mobile-chrome') }}
        path: blob-report/
        retention-days: 1

  deploy-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Reports
        run: npx playwright merge-reports --config=merge.config.ts ./all-blob-reports

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true

      - name: Load Allure Report History from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history

      - name: Build Allure Report with Historical Trends
        uses: simple-elf/allure-report-action@v1.9
        if: always()
        id: allure-report
        with:
          allure_results: all-allure-results
          allure_history: allure-history
          keep_reports: 25

      - name: Copy Playwright HTML Report into Publish Directory
        if: always()
        run: |
          mkdir -p allure-history/playwright
          cp -rf ./playwright-report/* allure-history/playwright/ || true

      - name: Automated GitHub Issue Manager (Create/Close Issues)
        if: always()
        run: node scripts/manage-issues.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT: ${{ github.event_name }}

      - name: Run Slack Notifier
        if: always()
        run: node slack-notify.js
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER: ${{ github.server_url }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT: ${{ github.event_name }}
          BASE_URL: 'https://smartcarcheck.uk'

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          force_orphan: false